<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>インベーダーゲーム</title>
  <style>
    body {
      margin: 0;
      background: #000;
      color: #fff;
      font-family: "Hiragino Kaku Gothic ProN", "Meiryo", sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }

    h1 {
      margin: 12px 0 6px;
      font-size: 22px;
      letter-spacing: 2px;
    }

    #info {
      margin-bottom: 10px;
      font-size: 14px;
      color: #9ff;
    }

    canvas {
      background: #001020;
      border: 2px solid #0ff;
      box-shadow: 0 0 20px rgba(0, 255, 255, 0.35);
    }
  </style>
</head>
<body>
  <h1>インベーダーゲーム</h1>
  <div id="info">← → で移動 / Space でショット / R でリスタート</div>
  <canvas id="game" width="480" height="520"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");

    const player = {
      x: canvas.width / 2 - 20,
      y: canvas.height - 40,
      w: 40,
      h: 20,
      speed: 5,
      cooldown: 0
    };

    let bullets = [];
    let enemyBullets = [];
    let invaders = [];
    let score = 0;
    let lives = 3;
    let gameOver = false;
    let win = false;
    let invaderDir = 1;
    let invaderSpeed = 2;

    const keys = {};

    function reset() {
      player.x = canvas.width / 2 - 20;
      player.cooldown = 0;

      bullets = [];
      enemyBullets = [];
      invaders = [];

      score = 0;
      lives = 3;
      gameOver = false;
      win = false;
      invaderDir = 1;
      invaderSpeed = 2;

      for (let row = 0; row < 4; row++) {
        for (let col = 0; col < 8; col++) {
          invaders.push({
            x: 40 + col * 45,
            y: 60 + row * 35,
            w: 30,
            h: 20,
            alive: true
          });
        }
      }
    }

    function rectIntersect(a, b) {
      return (
        a.x < b.x + b.w &&
        a.x + a.w > b.x &&
        a.y < b.y + b.h &&
        a.y + a.h > b.y
      );
    }

    function update() {
      if (gameOver || win) return;

      if (keys["ArrowLeft"] || keys["KeyA"]) {
        player.x -= player.speed;
      }

      if (keys["ArrowRight"] || keys["KeyD"]) {
        player.x += player.speed;
      }

      player.x = Math.max(0, Math.min(canvas.width - player.w, player.x));

      if (player.cooldown > 0) player.cooldown--;

      if (keys["Space"] && player.cooldown <= 0) {
        bullets.push({
          x: player.x + player.w / 2 - 2,
          y: player.y - 12,
          w: 4,
          h: 12
        });
        player.cooldown = 15;
      }

      bullets.forEach((b) => (b.y -= 7));
      bullets = bullets.filter((b) => b.y + b.h > 0);

      enemyBullets.forEach((b) => (b.y += 5));
      enemyBullets = enemyBullets.filter((b) => b.y < canvas.height);

      const aliveInvaders = invaders.filter((i) => i.alive);

      if (aliveInvaders.length > 0) {
        let hitEdge = false;

        aliveInvaders.forEach((i) => {
          i.x += invaderDir * invaderSpeed;

          if (i.x < 10 || i.x + i.w > canvas.width - 10) {
            hitEdge = true;
          }
        });

        if (hitEdge) {
          invaderDir *= -1;
          aliveInvaders.forEach((i) => {
            i.y += 20;
            i.x += invaderDir * invaderSpeed;
          });
          invaderSpeed += 0.1;
        }

        if (Math.random() < 0.02) {
          const shooter = aliveInvaders[Math.floor(Math.random() * aliveInvaders.length)];
          enemyBullets.push({
            x: shooter.x + shooter.w / 2 - 2,
            y: shooter.y + shooter.h,
            w: 4,
            h: 12
          });
        }
      }

      bullets.forEach((b) => {
        invaders.forEach((i) => {
          if (i.alive && rectIntersect(b, i)) {
            i.alive = false;
            b.y = -100;
            score += 10;
          }
        });
      });

      bullets = bullets.filter((b) => b.y + b.h > 0);

      enemyBullets.forEach((b) => {
        if (rectIntersect(b, player)) {
          b.y = canvas.height + 100;
          lives--;

          if (lives <= 0) {
            gameOver = true;
          }
        }
      });

      enemyBullets = enemyBullets.filter((b) => b.y < canvas.height);

      invaders.forEach((i) => {
        if (i.alive && i.y + i.h >= player.y) {
          gameOver = true;
        }
      });

      if (invaders.every((i) => !i.alive)) {
        win = true;
      }
    }

    function drawPlayer() {
      ctx.fillStyle = "#0f0";
      ctx.fillRect(player.x, player.y, player.w, player.h);

      ctx.fillStyle = "#0a0";
      ctx.fillRect(player.x + player.w / 2 - 4, player.y - 10, 8, 10);
    }

    function drawInvaders() {
      invaders.forEach((i) => {
        if (!i.alive) return;

        ctx.fillStyle = "#f0f";
        ctx.fillRect(i.x, i.y, i.w, i.h);

        ctx.fillStyle = "#000";
        ctx.fillRect(i.x + 6, i.y + 6, 6, 6);
        ctx.fillRect(i.x + i.w - 12, i.y + 6, 6, 6);
      });
    }

    function drawBullets() {
      ctx.fillStyle = "#ff0";
      bullets.forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h));

      ctx.fillStyle = "#f00";
      enemyBullets.forEach((b) => ctx.fillRect(b.x, b.y, b.w, b.h));
    }

    function drawText() {
      ctx.fillStyle = "#fff";
      ctx.font = "18px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(`スコア: ${score}`, 12, 28);
      ctx.fillText(`ライフ: ${lives}`, 12, 52);

      if (gameOver || win) {
        ctx.textAlign = "center";
        ctx.font = "32px sans-serif";

        if (win) {
          ctx.fillStyle = "#0f0";
          ctx.fillText("YOU WIN!", canvas.width / 2, canvas.height / 2 - 20);
        } else {
          ctx.fillStyle = "#f00";
          ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
        }

        ctx.font = "18px sans-serif";
        ctx.fillStyle = "#fff";
        ctx.fillText("R キーでリスタート", canvas.width / 2, canvas.height / 2 + 20);
      }
    }

    function draw() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      drawPlayer();
      drawInvaders();
      drawBullets();
      drawText();
    }

    function loop() {
      update();
      draw();
      requestAnimationFrame(loop);
    }

    window.addEventListener("keydown", (e) => {
      keys[e.code] = true;

      if (e.code === "Space") {
        e.preventDefault();
      }

      if (e.code === "KeyR") {
        reset();
      }
    });

    window.addEventListener("keyup", (e) => {
      keys[e.code] = false;
    });

    reset();
    loop();
  </script>
</body>
</html>
